<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LUNARIS — Base Camp · Full-Screen Explorer</title><style>
:root{--bg:#070b16;--panel:#0e1629;--panel2:#16213b;--line:#2a3d63;--teal:#4fe3d0;--amber:#ffb454;--red:#ff5d6c;--tx:#e6f1ff;--mut:#8fa3c2;--wall:#101a30;--floor:#1b2744;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070b16}}
:root[data-theme="dark"]{--bg:#070b16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--teal)}button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.pri{background:var(--teal);color:#04201d;border-color:var(--teal);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
#hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#hud b{font-size:16px;letter-spacing:.5px}
.res{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.bar{width:70px;height:7px;background:#0a1020;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
#view{position:relative;height:440px;overflow:hidden;background:var(--wall);border-bottom:1px solid var(--line)}
#world{position:absolute;left:0;top:0;width:1600px;height:440px;will-change:transform}
#wall{position:absolute;inset:0 0 70px 0;background:repeating-linear-gradient(90deg,#0f1a31 0 120px,#0c1529 120px 122px)}
#win{position:absolute;left:230px;top:28px;width:1140px;height:210px;border:6px solid #2b3a5e;border-radius:14px;overflow:hidden;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 20%,#fff,transparent),radial-gradient(2px 2px at 80% 50%,#cfe,transparent),radial-gradient(1px 1px at 35% 60%,#fff,transparent),#02040b;box-shadow:0 0 40px rgba(79,227,208,.12) inset}
#earth{position:absolute;right:150px;top:24px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7fc4ff,#1a4d9a 60%,#0b2350)}
#ground{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(#8e93a0,#5c6172);border-radius:50% 50% 0 0/30px 30px 0 0}
#floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(var(--floor),#0f1730);border-top:3px solid #34476f}
.st{position:absolute;bottom:70px;text-align:center;transform:translateX(-50%)}
.st small{display:block;color:var(--mut);font-size:11px;margin-top:4px;white-space:nowrap}
.st.near .dev{box-shadow:0 0 22px var(--teal);border-color:var(--teal)}
.dev{border:2px solid #3a4e7a;background:var(--panel2);border-radius:8px;transition:box-shadow .2s;position:relative}
.badge{position:absolute;top:-9px;right:-9px;background:var(--amber);color:#201400;border-radius:12px;font-size:11px;font-weight:700;padding:1px 7px;display:none}
#airlock .dev{width:100px;height:170px;border-radius:50px 50px 6px 6px;background:linear-gradient(#26365c,#1a2745)}
#airlock .dev:after{content:"";position:absolute;left:30px;top:30px;width:38px;height:38px;border-radius:50%;border:3px solid var(--amber);background:#0a1020}
#cal .dev{width:130px;height:120px;margin-bottom:34px;background:linear-gradient(#10303a,#0d2230);display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px;align-content:center}
#cal .dev i{aspect-ratio:1;border-radius:3px;background:#1d4a55}#cal .dev i.on{background:var(--teal);box-shadow:0 0 8px var(--teal)}#cal .dev i.dn{background:#2f7d6e}
#map .dev{width:130px;height:110px;margin-bottom:40px;background:radial-gradient(circle at 50% 50%,#12494a,#0b1f2c);overflow:hidden}
#map .dev:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#2b8f88 50%,transparent 52%),linear-gradient(transparent 48%,#2b8f88 50%,transparent 52%);opacity:.5}
#map .dev:after{content:"";position:absolute;left:62px;top:48px;width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
#table .dev{width:200px;height:56px;border-radius:6px;background:#1a2c4c}
#table .holo{position:absolute;left:30px;right:30px;bottom:56px;height:84px;background:linear-gradient(transparent,rgba(79,227,208,.35));clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{opacity:.6}}
#sys .dev{width:120px;height:130px;background:linear-gradient(#25213f,#16152b);padding:12px;text-align:left;font-size:10px;color:var(--mut)}
#arc .dev{width:130px;height:140px;background:linear-gradient(#1d2a3f,#141d30);padding:12px;font-size:10px;color:var(--mut);text-align:left}
#luna{position:absolute;left:1180px;bottom:200px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,#c9fff8,#2bc7b4);box-shadow:0 0 24px var(--teal);animation:fl 2.5s infinite}
#ast{position:absolute;bottom:70px;width:34px;height:64px;transform:translateX(-50%)}
#ast .b{position:absolute;bottom:0;left:4px;width:26px;height:36px;background:#e8edf6;border-radius:8px 8px 4px 4px;box-shadow:inset -5px 0 #b8c2d6}
#ast .h{position:absolute;top:0;left:3px;width:28px;height:28px;border-radius:50%;background:#f4f6fb}
#ast .v{position:absolute;top:7px;width:17px;height:13px;border-radius:7px;background:linear-gradient(#1a2a55,#3c78c8)}
#ast.r .v{right:2px}#ast.l .v{left:2px}
#ast.walk .b{animation:bob .3s infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}
#prompt{position:absolute;transform:translateX(-50%);background:#04201d;color:var(--teal);border:1px solid var(--teal);padding:3px 10px;border-radius:6px;font-size:12px;white-space:nowrap;display:none;z-index:4}
#warn{position:absolute;inset:0;pointer-events:none;display:none;box-shadow:inset 0 0 90px rgba(255,93,108,.5);animation:fl 1.6s infinite;z-index:3}
body.d5 #warn,body.d6 #warn{display:block}
body.d5 #win,body.d6 #win{border-color:#8a3340}
body.d7 #table .holo{background:linear-gradient(transparent,rgba(255,180,84,.55));animation-duration:1.4s}
body.d7 #table .dev{border-color:var(--amber)}
#guide{position:absolute;right:10px;top:10px;width:230px;background:rgba(14,22,41,.93);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;z-index:5}
#guide h4{margin:0 0 4px;font-size:13px;color:var(--teal)}
#guide .obj{font-weight:700;margin:2px 0 6px}
#guide .hint{color:var(--mut);min-height:36px}
#guide .row{display:flex;gap:6px;margin-top:8px}#guide button{padding:4px 9px;font-size:12px}
#touch{display:none;gap:10px;justify-content:center;padding:10px}
#touch button{width:64px;height:48px;font-size:18px}
@media (max-width:720px){#touch{display:flex}#guide{position:static;width:auto;margin:8px;border-radius:10px}#view{height:420px}}
#help{padding:8px 14px;color:var(--mut);font-size:12px}
#ov{position:fixed;inset:0;background:rgba(2,5,12,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#ov.on{display:flex}
#pn{background:var(--panel);border:1px solid var(--teal);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 0 50px rgba(79,227,208,.18)}
#pn h2{margin:0 0 4px;font-size:22px}#pn h3{margin:12px 0 4px;font-size:15px;color:var(--teal)}
.mut{color:var(--mut)}.luna{border-left:3px solid var(--teal);padding:6px 12px;background:#0b1a24;border-radius:0 8px 8px 0;margin:10px 0}
.days{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.days button{width:52px;height:52px;font-weight:700;position:relative}
.days button.cur{border-color:var(--teal);box-shadow:0 0 12px var(--teal)}.days button.sel{background:#1b3a4a}
.days button.lock{opacity:.4}.days button.done{background:#1d5a4e}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.task{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;margin:6px 0}
.task.on{border-color:var(--teal);background:#143a3c}.task b{display:block}
.chip{display:inline-block;background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bld{padding:8px;border-radius:8px;border:1px solid var(--line);background:#0b1a24;cursor:pointer;text-align:left}
.bld.tgt{border-color:var(--amber);box-shadow:0 0 12px var(--amber)}
.x{float:right;padding:2px 9px}
.big{height:10px}.big i{background:var(--teal)}.big.low i{background:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html,body{width:100%;height:100%;overflow:hidden;background:#0b1428}#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}#hud{position:fixed;left:14px;top:12px;right:auto;max-width:calc(100vw - 28px);border:1px solid rgba(94,199,205,.5);border-radius:12px;z-index:8;background:rgba(8,20,39,.87);backdrop-filter:blur(10px);padding:7px 11px}#hud b{font-size:13px}#guide{position:fixed;right:14px;top:78px;width:250px;z-index:8;background:rgba(10,23,43,.83);backdrop-filter:blur(8px)}#help{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:8;background:rgba(9,20,37,.78);border-radius:25px;padding:7px 16px;text-align:center;max-width:95vw}#compat{display:none}#ov{z-index:30}#pn{background:rgba(14,26,48,.97)}#touch{position:fixed;bottom:42px;left:10px;z-index:9}#touch button{background:rgba(17,38,68,.83)}@media(max-width:720px){#guide{top:75px;right:8px;width:210px;margin:0;font-size:11px}#hud{max-width:calc(100vw - 16px);left:8px;top:8px}#help{bottom:2px;font-size:10px}#touch{display:flex}}
</style></head><body class="d1"><canvas id="c"></canvas><div id="hud"></div><div id="guide"></div><div id="help">← → walk sideways · ↑ toward the back wall · ↓ toward you · E interact · Esc close</div><div id="touch"><button id="bl">◀</button><button id="be" class="pri">E</button><button id="br">▶</button></div><div id="ov"><div id="pn" role="dialog" aria-modal="true"></div></div><div id="compat"><div id="cal"><div class="dev"></div></div><div id="sysdev"></div><div id="tlabel"></div></div><script>
const $=s=>document.querySelector(s);
const KEY="lunaris-basecamp-v1";
const DAYS=[
 {t:"The First Spark",g:"Restore the Outpost’s Power",s:"Our habitat is operational, but its electricity supply is limited. Decide which systems receive power first.",o:["Read the mission briefing","Inspect the outpost map","Visit the Power Center","Restore essential systems"],loc:"Power Center",r:"Stable power grid"},
 {t:"Water from Shadow",g:"Find and Extract Water Ice",s:"Permanently shadowed craters may hold frozen water. Extraction costs energy, so plan carefully.",o:["Scan the crater rim","Visit the Water Extractor","Balance power and water"],loc:"Water Extractor",r:"Water reserve +"},
 {t:"Breathing Room",g:"Balance Life Support",s:"Oxygen scrubbers and plants share the same power. Which one gets priority tonight?",o:["Check oxygen levels","Tune the Life Support unit","Log a prediction"],loc:"Life Support",r:"Oxygen buffer"},
 {t:"Green Experiment",g:"Grow the First Crop",s:"Space biology needs light, water and warmth. Your greenhouse is a test of all three.",o:["Prepare the Greenhouse","Plant seeds","Record growth data"],loc:"Greenhouse",r:"Science progress"},
 {t:"Solar Storm Warning",g:"Prepare for a Solar Flare",s:"Sensors detect a flare heading your way. Protect your systems before the particles arrive.",o:["Read the space-weather alert","Shield critical systems","Shelter the crew"],loc:"Comms Tower",r:"Storm readiness"},
 {t:"After the Storm",g:"Assess and Repair",s:"The flare has passed. Some systems are strained. Find what failed and fix it.",o:["Scan for damage","Repair strained systems","Compare prediction to result"],loc:"Storage Depot",r:"Repair expertise"},
 {t:"Mission Engineer",g:"Run the Final Console",s:"Everything you learned comes together. Combine power, water, oxygen and science into one final plan.",o:["Review your 7-day record","Allocate final resources","Launch the report"],loc:"Rover Garage",r:"Mission Engineer badge"}];
const BLD=[["Power Center","Generates and distributes electricity."],["Water Extractor","Melts and filters lunar ice."],["Life Support","Scrubs CO₂ and makes oxygen."],["Greenhouse","Grows food and tests space biology."],["Science Lab","Analyzes samples and experiments."],["Comms Tower","Links to Earth and space-weather alerts."],["Observatory","Watches the Sun and the sky."],["Storage Depot","Holds spare parts and supplies."],["Medical Bay","Keeps the crew healthy."],["Rover Garage","Home of the lunar rover."]];
const TASKS=[{id:"insp",n:"Inspect life-support systems",d:"Identify potential faults",h:1},{id:"rep",n:"Repair the power network",d:"Improve energy reliability",h:2},{id:"res",n:"Prepare a research experiment",d:"Earn science progress",h:2},{id:"sup",n:"Organize emergency supplies",d:"Improve preparedness",h:1}];
const STEPS=[
 {id:"map",l:"Open the Outpost Map",h:["Look for a teal screen near the middle of the room.","It’s the glowing map with an amber pin, left of the holo table.","Walk to the map terminal and press E."]},
 {id:"plan",l:"Plan today’s crew schedule",h:["The holographic table in the center is your planning tool.","Walk to the glowing table and press E.","Pick tasks up to 3 hours, then confirm the schedule."]},
 {id:"sys",l:"Review the Systems Terminal",h:["Check how your supplies are holding up.","The purple terminal on the right side of the room.","Walk to the Systems Terminal and press E."]},
 {id:"arc",l:"Read a NASA Archive entry",h:["Real science is stored at the far end.","The archive terminal is the last station on the right.","Reach the far right wall and press E, then open an entry."]},
 {id:"out",l:"Go outside and complete today’s mission",h:["Your mission is outside the base.","The round-windowed door on the far left is the airlock.","Walk to the airlock and press E."]}];
const ARC=[
 {n:"Solar flares",m:"Measured: X-ray and particle bursts from the Sun, tracked by NOAA and NASA spacecraft.",g:"In the game: Days 5–6 give you a warning, and you protect systems before the storm.",s:"Simplified: real forecasts give hours to days of notice, and radiation effects are far more complex."},
 {n:"Lunar water ice",m:"Measured: hydrogen and reflected light inside permanently shadowed craters, from orbiters like LRO.",g:"In the game: Day 2 asks you to spend energy to extract water.",s:"Simplified: real ice is mixed with soil and the amount is uncertain."},
 {n:"Space biology",m:"Measured: how plants and microbes grow in low gravity, studied aboard the ISS.",g:"In the game: Day 4’s greenhouse needs light, water and warmth together.",s:"Simplified: real crops take weeks, not one day."}];

const def=()=>({day:1,intro:false,prog:{},crew:{},res:{power:80,water:80,oxygen:90,science:0,prep:0},log:{},hint:0,cons:[],out:{},over:false});
function load(){try{const v=localStorage.getItem(KEY);if(v)return Object.assign(def(),JSON.parse(v))}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),px=180,py=770,face="r",keys={},open=false,near=null,cam=0;
const WORLD=2000,ST=[["airlock",150],["cal",445],["map",755],["table",1040],["sys",1380],["arc",1760]];
const NAMES={airlock:"Airlock",cal:"Mission Calendar",map:"Outpost Map",table:"Mission Planning",sys:"Systems Terminal",arc:"NASA Science Archive"};
const done=id=>(S.prog[S.day]||[]).includes(id);
const mark=id=>{(S.prog[S.day]=S.prog[S.day]||[]);if(!S.prog[S.day].includes(id)){S.prog[S.day].push(id);save()}render()};
const step=()=>STEPS.find(s=>!done(s.id));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function render(){
  document.body.className="d"+S.day;
  const R=S.res;
  const rb=(n,v)=>`<span class="res">${n}<span class="bar"><i style="width:${clamp(v,0,100)}%;${v<30?"background:var(--red)":""}"></i></span>${Math.round(v)}</span>`;
  $("#hud").innerHTML=`<b>🌕 LUNARIS · Base Camp</b><b style="color:var(--teal)">Day 0${S.day}</b>${rb("⚡ Power",R.power)}${rb("💧 Water",R.water)}${rb("🫁 Oxygen",R.oxygen)}<span class="res">🔬 Science ${R.science}</span><button style="margin-left:auto;padding:3px 10px;font-size:12px" id="rst">Reset</button>`;
  $("#rst").onclick=()=>{if(confirm("Reset all Base Camp progress?")){S=def();save();render();intro()}};
  const st=step(),n=(S.prog[S.day]||[]).length;
  $("#guide").innerHTML=`<h4>LUNA · Mission Guide</h4><div class="mut">Day ${S.day} · ${DAYS[S.day-1].t}</div><div class="obj">${S.over?"Mission complete":st?st.l:"End the day at the airlock"}</div><div class="hint">${S.over?"You thought like a mission engineer. Open the calendar to see your record.":st?"💡 "+st.h[Math.min(S.hint,2)]:"All objectives done. Press E at the airlock to rest and begin the next day."}</div><div class="row"><button id="hb">Hint</button><button id="cb">Calendar</button><span class="mut" style="align-self:center">${n}/5</span></div>`;
  $("#hb").onclick=()=>{S.hint++;render()};$("#cb").onclick=()=>cal();
  const cd=$("#cal .dev");cd.innerHTML=Array.from({length:7},(_,i)=>`<i class="${i+1<S.day?"dn":i+1==S.day?"on":""}"></i>`).join("")+`<span class="badge" style="display:${S.day>=3?"block":"none"}">${S.day>=5?"!":S.day}</span>`;
  $("#tlabel").textContent=S.day==7?"FINAL MISSION CONSOLE":"Mission Planning Table";
  $("#sysdev").innerHTML=`SYSTEMS<br>PWR ${Math.round(R.power)}<br>H₂O ${Math.round(R.water)}<br>O₂ ${Math.round(R.oxygen)}<br>${S.day>=5&&S.day<7?'<b style="color:var(--red)">⚠ STRAIN</b>':S.day>=3?"forecast ✓":""}`;
}
function ovOpen(h){open=true;$("#pn").innerHTML=`<button class="x" id="xx">✕</button>`+h;$("#ov").classList.add("on");$("#xx").onclick=ovClose}
function ovClose(){open=false;$("#ov").classList.remove("on")}
$("#ov").addEventListener("mousedown",e=>{if(e.target.id=="ov")ovClose()});

function intro(){
  if(S.intro)return cal();
  ovOpen(`<h2>Mission Headquarters · Day 01</h2><div class="luna"><b>LUNA:</b> “Welcome to Base Camp, Commander! You’re responsible for keeping our lunar outpost running for seven days. Every drop of water and every unit of energy matters. Ready to take command?”</div><button class="pri" id="go">Take command</button>`);
  $("#go").onclick=()=>{S.intro=true;save();cal()};
}
let selDay=null;
function cal(){
  selDay=selDay||S.day;const D=DAYS[selDay-1];
  const btn=i=>{const c=i<S.day?"done":i==S.day?"cur":"lock";return `<button class="${c} ${i==selDay?"sel":""}" data-d="${i}">${i<S.day?"✓":"0"+i}</button>`};
  const lg=S.log[selDay]||[];
  ovOpen(`<h2>Mission Planner · 7 Days to Survive</h2><div class="days">${[1,2,3,4,5,6,7].map(btn).join("")}</div>
  <div class="card"><div class="mut">Day 0${selDay} — ${D.t}${selDay>S.day?" · locked":""}</div><h2 style="font-size:19px">${D.g}</h2><p>${D.s}</p>
  <h3>Objectives</h3><ul style="margin:0;padding-left:18px">${D.o.map(x=>`<li>${x}</li>`).join("")}</ul>
  <p><span class="chip">📍 ${D.loc}</span><span class="chip">🏅 ${D.r}</span></p>
  ${lg.length?`<h3>Your record</h3>${lg.map(x=>`<span class="chip">${x}</span>`).join("")}`:""}</div>
  <button class="pri" id="bd" ${S.over?"disabled":""}>${selDay==S.day?"Begin Day "+S.day:"Back to Day "+S.day}</button>`);
  document.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{selDay=+b.dataset.d;cal()});
  $("#bd").onclick=()=>{selDay=null;ovClose()};
}
function mapPanel(){
  const tgt=DAYS[S.day-1].loc;
  ovOpen(`<h2>Outpost Map</h2><p class="mut">Destination glows amber. Walk outside to reach it — no teleporting.</p><div class="grid">${BLD.map((b,i)=>`<div class="bld ${b[0]==tgt?"tgt":""}" data-i="${i}"><b>${b[0]}</b>${b[0]==tgt?" 🎯":""}</div>`).join("")}</div><div class="card" id="bi">Select a building to read what it does.</div><div class="luna"><b>LUNA:</b> Today’s target is the <b>${tgt}</b>. From the airlock, head toward the glowing marker.</div>`);
  document.querySelectorAll(".bld").forEach(b=>b.onclick=()=>{const x=BLD[b.dataset.i];$("#bi").innerHTML=`<b>${x[0]}</b><br>${x[1]}`});
  mark("map");
}
let pick=[];
function plan(){
  const c=S.crew[S.day];
  if(c){ovOpen(`<h2>${S.day==7?"Final Mission Console":"Crew Schedule · Day "+S.day}</h2><div class="card">Schedule confirmed:<br>${c.map(id=>`<span class="chip">${TASKS.find(t=>t.id==id).n}</span>`).join("")||"No optional tasks."}</div>${S.day==7?`<div class="luna"><b>LUNA:</b> Every system feeds this table. Finish today’s objectives, then end the day for your final report.</div>`:""}`);return}
  const used=()=>pick.reduce((a,id)=>a+TASKS.find(t=>t.id==id).h,0);
  const draw=()=>{ovOpen(`<h2>${S.day==7?"Final Mission Console · ":""}Crew Schedule — Day ${S.day}</h2><p><b>${3-used()}/3</b> crew-hours remain. Optional tasks only: story missions stay achievable either way.</p>${TASKS.map(t=>`<button class="task ${pick.includes(t.id)?"on":""}" data-t="${t.id}" ${!pick.includes(t.id)&&used()+t.h>3?"disabled":""}><span><b>${t.n}</b><span class="mut">${t.d}</span></span><span class="chip">${t.h}h</span></button>`).join("")}<button class="pri" id="cf">Confirm crew schedule</button>`);
    document.querySelectorAll(".task").forEach(b=>b.onclick=()=>{const id=b.dataset.t;pick=pick.includes(id)?pick.filter(x=>x!=id):[...pick,id];draw()});
    $("#cf").onclick=()=>{const R=S.res,L=(S.log[S.day]=S.log[S.day]||[]);
      if(pick.includes("insp")){R.prep+=5;L.push("Inspected life support")}
      if(pick.includes("rep")){R.power=Math.min(100,R.power+12);L.push("Repaired power network")}
      if(pick.includes("res")){R.science+=10;L.push("Ran experiment")}
      if(pick.includes("sup")){R.prep+=8;L.push("Stocked emergency supplies")}
      if(!pick.includes("rep"))S.cons.push({d:S.day+1,t:"Skipped power repair on Day "+S.day+": +4 power drain tomorrow.",p:4});
      S.crew[S.day]=[...pick];pick=[];save();mark("plan");plan()}};
  draw();
}
function sysPanel(){
  const R=S.res,bar=(n,v)=>`<div>${n} ${Math.round(v)}<div class="bar big ${v<30?"low":""}" style="width:100%"><i style="width:${clamp(v,0,100)}%"></i></div></div>`;
  const cs=S.cons.filter(c=>c.d==S.day+1||c.d==S.day);
  ovOpen(`<h2>Systems Terminal</h2>${bar("⚡ Power",R.power)}${bar("💧 Water",R.water)}${bar("🫁 Oxygen",R.oxygen)}<div class="card"><b>Daily consumption</b><br>Power −8 · Water −6 · Oxygen −4${S.day>=5&&S.day<=6?"<br><span style='color:var(--red)'>Solar storm: extra power drain, reduced by preparedness ("+R.prep+")</span>":""}</div><h3>Delayed consequences</h3>${cs.length?cs.map(c=>`<div class="card">⏳ ${c.t}</div>`).join(""):"<div class='card mut'>None pending. Skipping repairs creates consequences for the next day.</div>"}`);
  mark("sys");
}
function arcPanel(i){
  ovOpen(`<h2>NASA Science Archive</h2><p class="mut">Real science behind the game.</p>${ARC.map((a,k)=>`<div class="card"><button data-a="${k}" style="width:100%;text-align:left"><b>${a.n}</b></button>${i===k?`<p>${a.m}</p><p>${a.g}</p><p class="mut">${a.s}</p>`:""}</div>`).join("")}`);
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{arcPanel(+b.dataset.a);mark("arc")});
}
function airlock(){
  const st=step(),last=!st;
  ovOpen(`<h2>Airlock</h2><div class="luna"><b>LUNA:</b> Current objective: <b>${S.over?"Mission complete":st?st.l:"all done — time to rest"}</b>. Today’s outdoor target: ${DAYS[S.day-1].loc}.</div>
  <div class="card">Exiting returns you to the Moon landscape at the exact same position. In this prototype the exterior is a separate scene, so you can simulate it here.</div>
  <button id="ex" ${done("out")||S.over?"disabled":""}>${done("out")?"Outdoor mission complete ✓":"Go outside · complete today’s mission"}</button>
  <button class="pri" id="ed" ${(!done("out")||S.over)?"disabled":""}>${S.day==7?"End Day 7 · Final report":"End Day "+S.day+" · Rest"}</button>
  ${S.over?`<p class="mut">Your 7-day mission is finished.</p>`:""}`);
  $("#ex").onclick=()=>{mark("out");airlock()};
  $("#ed").onclick=endDay;
}
function endDay(){
  const R=S.res,storm=S.day>=5&&S.day<=6?Math.max(0,8-R.prep*0.5):0;
  let drain=8+storm;S.cons.filter(c=>c.d==S.day+1).forEach(c=>drain+=c.p);
  R.power=clamp(R.power-drain,0,100);R.water=clamp(R.water-6+(S.day==2?15:0),0,100);R.oxygen=clamp(R.oxygen-4,0,100);
  (S.log[S.day]=S.log[S.day]||[]).push("Power −"+Math.round(drain));
  if(S.day==7){S.over=true;save();render();return report()}
  S.day++;S.hint=0;selDay=null;save();render();ovClose();
  ovOpen(`<h2>Day 0${S.day} begins</h2><div class="luna"><b>LUNA:</b> “Good morning, Commander. ${DAYS[S.day-1].s}”</div>${S.day==5?`<div class="card" style="border-color:var(--red)">⚠ Space-weather warning: systems will show strain.</div>`:""}<button class="pri" id="ok">Open mission calendar</button>`);
  $("#ok").onclick=cal;
}
function report(){
  const R=S.res;
  ovOpen(`<h2>Mission Report · Mission Engineer</h2><p>Final power ${Math.round(R.power)}, water ${Math.round(R.water)}, oxygen ${Math.round(R.oxygen)}, science ${R.science}, preparedness ${R.prep}.</p>${[1,2,3,4,5,6,7].map(d=>`<div class="card"><b>Day ${d} · ${DAYS[d-1].t}</b><br>${(S.log[d]||[]).map(x=>`<span class="chip">${x}</span>`).join("")||"<span class='mut'>No decisions recorded.</span>"}</div>`).join("")}<div class="luna"><b>LUNA:</b> “You entered as a beginner. You leave thinking like a mission engineer.”</div>`);
}

 ctx.strokeStyle='rgba(64,91,124,.26)';ctx.lineWidth=2;for(let i=-15;i<25;i++){ctx.beginPath();ctx.moveTo(1000+i*95,370);ctx.lineTo(1000+i*240,1200);ctx.stroke()}
 for(let i=1;i<12;i++){let y=370+680*(i/12)**1.65;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke()}
 // Panoramic Moon-facing windows
 for(const [wx,ww] of [[290,630],[1150,650]]){
 rounded(wx-13,52,ww+26,266,18,'#7188a4','#536e91');ctx.save();ctx.beginPath();ctx.roundRect(wx,65,ww,238,10);ctx.clip();
 let sp=ctx.createLinearGradient(0,65,0,303);sp.addColorStop(0,'#030918');sp.addColorStop(1,'#172a55');ctx.fillStyle=sp;ctx.fillRect(wx,65,ww,238);
 stars.forEach(st=>{let sx=wx+(st.x%ww);ctx.fillStyle=`rgba(240,250,255,${.45+.45*Math.sin(t*.001+st.x)})`;ctx.fillRect(sx,75+st.y*.6,st.r,st.r)});
 ctx.fillStyle='#a3acbb';ctx.beginPath();ctx.ellipse(wx+ww*.46,322,ww*.7,89,0,Math.PI,0);ctx.fill();ctx.fillStyle='#8993a5';for(let j=0;j<6;j++){ctx.beginPath();ctx.ellipse(wx+50+j*105,292-(j%3)*12,18+j%3*7,6,0,0,7);ctx.fill()}
 if(wx===290){let ex=wx+ww*.72,ey=135;let eg=ctx.createRadialGradient(ex-8,ey-8,4,ex,ey,37);eg.addColorStop(0,'#a5e5ff');eg.addColorStop(1,'#2477c2');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(ex,ey,37,0,7);ctx.fill()}

 // Ceiling panels and recessed lights
 for(let x=180;x<WORLD;x+=370){rounded(x,10,235,20,9,'#edf7ff','#8ba1bc');rounded(x+14,14,205,8,5,'#b7fbf3');}

 rounded(30,165,190,335,18,'#536b8d','#293f63');rounded(49,187,152,290,11,'#172e50','#8db0d4');rounded(76,246,98,95,47,'#12283f','#73e4e5');ctx.fillStyle='#aaf9ef';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('AIRLOCK',125,220);
 rounded(338,165,210,174,15,'#2a4668','#5c8db3');rounded(357,183,172,128,9,'#0d2943','#55d6ce');ctx.fillStyle='#66e7d2';ctx.font='bold 16px system-ui';ctx.fillText('MISSION CALENDAR',443,206);for(let i=0;i<7;i++){rounded(372+(i%4)*38,225+Math.floor(i/4)*34,28,25,5,i+1<=S.day?'#4fe3d0':'#28475c')}
 rounded(640,154,228,188,14,'#304d6d','#6f9bb7');rounded(660,174,188,143,8,'#10283f','#63e7d5');ctx.strokeStyle='#318a9c';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(667+i*42,180);ctx.lineTo(667+i*42,310);ctx.stroke()}ctx.fillStyle='#ffcb68';ctx.beginPath();ctx.arc(759,243,9,0,7);ctx.fill();

function drawHolo(t){
 // Holographic command table in foreground, perspective depth

 rounded(786,675,30,105,6,'#647b98');rounded(1183,675,30,105,6,'#647b98');rounded(765,648,480,48,15,'#d8e5f2','#7b97b5');rounded(794,656,422,22,9,'#426b8c','#4fe3d0');

 ctx.fillStyle='rgba(30,40,65,.22)';ctx.beginPath();ctx.ellipse(px,py,w*.35,10*depth,0,0,7);ctx.fill();ctx.save();ctx.translate(px,py-bob);ctx.scale(face==='l'?-1:1,1);

function drawPrompt(){if(!near||open)return;const st=ST.find(a=>a[0]===near);label('[ E ] '+NAMES[near],st[1],Math.min(py-135,465))}
let lastTime=0;
function loop(t){let dt=Math.min(.045,(t-lastTime)/1000||0);lastTime=t;
 const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
 if(!open){const sp=285*dt/(dx&&dy?Math.SQRT2:1);px=clamp(px+dx*sp,65,WORLD-65);py=clamp(py+dy*sp*.82,535,860);if(dx)face=dx<0?'l':'r';

 if(px>745&&px<1250&&py>645&&py<790){if(dy<0)py=790;else if(dy>0)py=645;else px=dx>=0?1250:745;}}

 const viewWidth=RW;const target=clamp(px-viewWidth/2,0,WORLD-viewWidth);cam+=(target-cam)*.1;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b1428';ctx.fillRect(0,0,cw,ch);ctx.setTransform(scale,0,0,scale,offx,offy);
