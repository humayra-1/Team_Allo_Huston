<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moon Base Alpha — Laboratory</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0f1c;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#modal{position:fixed;inset:0;background:rgba(8,10,24,.8);display:flex;align-items:center;justify-content:center;z-index:5;padding:20px}
#card{background:#1b1f40;border:1px solid #3a4390;border-radius:16px;padding:28px 30px;max-width:400px;color:#eef0ff;text-align:center}
#card h2{margin:0 0 8px;font-size:1.3rem;color:#ffd23f}
#card p{margin:6px 0;color:#c4caee;font-size:.95rem;line-height:1.5}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin:16px 0}
.key{background:#2a3070;border:1px solid #4c58b8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.k-up{grid-column:2;grid-row:1}.k-l{grid-column:1;grid-row:2}.k-d{grid-column:2;grid-row:2}.k-r{grid-column:3;grid-row:2}
#startBtn{margin-top:8px;background:#3ee0c0;color:#0c0a1f;border:0;border-radius:10px;padding:10px 22px;font-weight:700;font-size:1rem;cursor:pointer}
#startBtn:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(18,22,40,.75);color:#dfe4ff;font-size:.85rem;padding:6px 14px;border-radius:999px;display:none;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">← → walk sideways · ↑ forward (toward the wall) · ↓ backward (toward you)</div>
<div id="modal"><div id="card">

<p>Step inside and look around — walk up to any instrument to see what it is.</p>
<div class="pad"><span class="key k-up">↑</span><span class="key k-l">←</span><span class="key k-d">↓</span><span class="key k-r">→</span></div>
<p>← → move left and right.<br>↑ walks forward toward the back wall, ↓ walks backward toward you.</p>
<button id="startBtn">Enter the lab</button>
</div></div>

function drawItem(it){const[w,h]=dim(it);x.save();x.translate(it.x,it.y);
 x.fillStyle='rgba(25,35,60,.16)';x.beginPath();x.ellipse(0,it.flat?h*.25:0,w*.42,it.flat?h*.1:Math.max(3,h*.04),0,0,7);x.fill();

 else{x.drawImage(pic[it.k],-w/2,-h,w,h);it._top=it.y-h}
 x.restore()}

/* astronaut movement: arrow keys — left/right sideways, up = forward (to the wall), down = backward (to you) */
const P={x:800,y:540,face:1,walk:0,moving:false};
const MINX=70,MAXX=1530,MINY=490,MAXY=865,BLK={x0:600,x1:1200,y0:588,y1:784};

const K={};let started=false;
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.preventDefault();K[e.key]=true});
addEventListener('keyup',e=>{K[e.key]=false});
document.getElementById('startBtn').onclick=()=>{started=true;document.getElementById('modal').style.display='none';document.getElementById('hint').style.display='block'};
function update(dt){
 let dx=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0),dy=(K.ArrowDown?1:0)-(K.ArrowUp?1:0);
 P.moving=!!(dx||dy);if(dx&&dy){dx*=.7071;dy*=.7071}
 const sp=300*dt;
 const nx=clamp(P.x+dx*sp,MINX,MAXX);if(!inB(nx,P.y))P.x=nx;
 const ny=clamp(P.y+dy*sp*.8,MINY,MAXY);if(!inB(P.x,ny))P.y=ny;
 if(dx)P.face=dx>0?1:-1;if(P.moving)P.walk+=dt*10;}
function fallbackAstro(h){const u=h/100;x.fillStyle='#e8e4f5';x.fillRect(-12*u,-30*u,10*u,30*u);x.fillRect(2*u,-30*u,10*u,30*u);
 x.fillStyle='#9a8fd6';x.fillRect(-24*u,-64*u,9*u,32*u);x.fillStyle='#f4f1ff';x.fillRect(-16*u,-66*u,32*u,38*u);
 x.fillStyle='#3ee0c0';x.fillRect(-16*u,-52*u,32*u,8*u);x.beginPath();x.arc(0,-78*u,18*u,0,7);x.fill();
 x.fillStyle='#1c3a7a';x.beginPath();x.arc(3*u,-78*u,11*u,0,7);x.fill();}
function drawAstro(){
 const f=.8+.42*((P.y-MINY)/(MAXY-MINY)),h=ASTRONAUT_HEIGHT*f,w=astroOK?h*astro.naturalWidth/astro.naturalHeight:h*.5;
 const bob=P.moving?Math.abs(Math.sin(P.walk))*5*f:0;
 x.save();x.translate(P.x,P.y);
 x.fillStyle='rgba(25,35,60,.25)';x.beginPath();x.ellipse(0,0,w*.38,h*.05,0,0,7);x.fill();
 x.translate(0,-bob);x.scale(P.face,1);
 if(astroOK)x.drawImage(astro,-w/2,-h,w,h);else fallbackAstro(h);
 x.restore();}
 

function nearItem(){let best=null,bd=1e9;
 for(const it of ITEMS){const dx=Math.abs(P.x-it.x);if(dx>(it.k==='storage'?130:85))continue;
  if(it.table?P.y<570:P.y>=570)continue;if(dx<bd){bd=dx;best=it}}
 return best}
function drawLabel(){const it=nearItem();if(!it||it._top==null)return;

 x.font='600 20px system-ui';const tw=x.measureText(it.n).width+30;
 const lx=clamp(it.x,tw/2+10,RW-tw/2-10),ly=Math.max(it._top-14,40);
 x.fillStyle='rgba(18,22,40,.88)';rr(lx-tw/2,ly-27,tw,36,18);x.fill();
 x.fillStyle='#fff';x.textAlign='center';x.fillText(it.n,lx,ly-2);}

let last=0;
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(started)update(dt);
 x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.setTransform(S,0,0,S,OX,OY);
 drawRoom(ts);shelf(60,570,175);shelf(1040,1540,175);
 ITEMS.filter(i=>i.y===175).forEach(drawItem);
 drawBench();ITEMS.filter(i=>i.y===362).forEach(drawItem);
 drawItem(ITEMS.find(i=>i.k==='storage'));
 if(P.y<772){drawAstro();drawTable()}else{drawTable();drawAstro()}
 drawLabel();
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
